---
name: Release Lauth

on:
  push:
    tags:
      - 'v*'

jobs:
  build-image:
    name: Build production image ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-production.yml
    with:
      image_name: ${{ vars.IMAGE_NAME }}
      tag: ${{ github.ref_name }}
      dockerfile: ./lauth/Dockerfile
      target: production
    secrets: inherit

  build-apache:
    name: Build Apache image and Debian packages ${{ github.ref_name }}
    needs: build-image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-apache-latest.yml
    with:
      image_tag: ${{ needs.build-image.outputs.image_tag }}

  release:
    needs: [build-image, build-apache]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Apache Debian packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lauth-apache-debs_${{ github.sha }}
          path: release-assets/apache

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    needs: [build-image, release]
    name: Deploy staging
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image_tag: ${{ needs.build-image.outputs.image_tag }}
    secrets: inherit
