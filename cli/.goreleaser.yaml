version: 2

project_name: lauth

before:
  hooks:
    - go test ./...

builds:
  - id: lauth
    main: ./cmd/lauth
    binary: lauth
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lauth
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - ../LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: mlibrary
    name: lauth
  draft: false
  prerelease: auto
  extra_files:
    # Relative to the cli/ working directory; downloaded from the Apache job artifact.
    - glob: ../release-assets/apache/*.deb

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
